# Smithery configuration for Jurisprudência TST
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tst

name: tst-mcp
displayName: "Jurisprudência TST"
description: >
  Pesquise jurisprudência trabalhista do **TST**, a última palavra em matéria do trabalho. Além de acórdãos, o TST orienta por súmulas e orientações jurisprudenciais, que é o que de fato guia a instância inferior, e a busca cobre as três. A mesma conexão alcança outros 16 tribunais quando a questão é mista. Grátis, sem login, hospedado pela plataforma.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tst-mcp
repository: https://github.com/mcp-dir/tst-mcp

tags:
  - tst
  - trabalhista
  - labour-law
  - justica-do-trabalho
  - sumulas
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tst

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tst/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
